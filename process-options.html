<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XXVII — варианты блока «Четыре шага»</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#171717;--bg2:#1e1b1a;--card:#211a18;--ink:#f2efe9;--muted:#9a948c;--dim:#6d6a65;--milk:#e8d9c9;--paper:#f4f0e9;--pink:#2b2421;--wine:#780e19;--wine-hi:#a3202f;--wine-soft:#d8a397;--line:rgba(255,255,255,.1);--ease:cubic-bezier(.22,1,.36,1);--f:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h2,h3{font-weight:600;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}p{text-wrap:pretty}
.wrap{width:min(1240px,100% - 40px);margin-inline:auto}
.bar{position:sticky;top:0;z-index:50;background:rgba(14,14,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;padding:12px 0}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>span{font-size:12px;color:var(--dim);margin-right:4px}
.grp button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);transition:.25s}
.grp button.on{background:var(--milk);color:#2b2421;border-color:var(--milk)}
/* сцена */
.stage{padding:clamp(70px,9vw,130px) 0;transition:background .5s,color .5s}
.stage.light{background:var(--paper);color:var(--pink);--t-ink:#2b2421;--t-muted:#6b5f58;--t-line:rgba(43,36,33,.14);--t-card:#fffcf7;--t-acc:#780e19;--t-accs:#a3202f}
.stage.dark{background:var(--bg2);color:var(--ink);--t-ink:#f2efe9;--t-muted:#9a948c;--t-line:rgba(255,255,255,.14);--t-card:#211a18;--t-acc:#a3202f;--t-accs:#d8a397}
.head{margin-bottom:clamp(40px,5vw,64px)}
.head h2{font-size:clamp(34px,4.6vw,66px);max-width:16ch;color:var(--t-ink)}
.head p{margin-top:22px;max-width:52ch;color:var(--t-muted)}
.ico{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:1px solid var(--t-line);color:var(--t-acc);flex:0 0 auto;transition:.4s var(--ease);background:var(--t-card)}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.on-ico{background:var(--t-acc);border-color:var(--t-acc);color:#fff}
/* A: вертикальный путь, линия растёт при прокрутке */
.vA .path{position:relative;max-width:820px;padding-left:92px}
.vA .rail{position:absolute;left:23px;top:24px;bottom:24px;width:2px;background:var(--t-line)}
.vA .rail i{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--t-acc);transform-origin:top;transform:scaleY(var(--p,0))}
.vA .st{position:relative;padding:0 0 clamp(36px,5vw,56px);opacity:.35;transition:opacity .6s var(--ease)}
.vA .st:last-child{padding-bottom:0}
.vA .st.on{opacity:1}
.vA .st .ico{position:absolute;left:-92px;top:0}
.vA .st h3{font-size:clamp(26px,3vw,40px);color:var(--t-ink);margin-bottom:10px;padding-top:6px}
.vA .st p{color:var(--t-muted);max-width:52ch}
/* B: тягучие вкладки */
.vB .tabs{display:grid;grid-template-columns:minmax(260px,.8fr) 1.2fr;gap:clamp(24px,5vw,72px);align-items:start}
.vB .list{position:relative;display:grid;gap:6px}
.vB .pill{position:absolute;left:0;right:0;border-radius:20px;background:var(--t-card);border:1px solid var(--t-line);transition:top .55s var(--ease),height .55s var(--ease);z-index:0}
.vB .tb{position:relative;z-index:1;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;text-align:left;font-size:clamp(20px,2vw,26px);font-weight:600;letter-spacing:-.02em;color:var(--t-muted);transition:color .3s}
.vB .tb.on{color:var(--t-ink)}
.vB .tb .ico{width:40px;height:40px;border-radius:12px}
.vB .tb.on .ico{background:var(--t-acc);border-color:var(--t-acc);color:#fff}
.vB .panel{position:relative;min-height:280px;padding:clamp(24px,3vw,40px);border-radius:28px;background:var(--t-card);border:1px solid var(--t-line)}
.vB .pn{position:absolute;inset:clamp(24px,3vw,40px);opacity:0;transform:translateY(14px);transition:opacity .5s var(--ease),transform .6s var(--ease);pointer-events:none}
.vB .pn.on{opacity:1;transform:none;pointer-events:auto}
.vB .pn h3{font-size:clamp(28px,3.2vw,44px);color:var(--t-ink);margin:18px 0 12px}
.vB .pn p{color:var(--t-muted);max-width:46ch}
.vB .pn .big{width:64px;height:64px;border-radius:18px}
/* C: подсветка списка за курсором */
.vC .rows{position:relative;border-top:1px solid var(--t-line)}
.vC .hl{position:absolute;left:-14px;right:-14px;border-radius:22px;background:var(--t-card);border:1px solid var(--t-line);opacity:0;transition:top .45s var(--ease),height .45s var(--ease),opacity .25s;z-index:0;pointer-events:none}
.vC .rw{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.1fr 28px;gap:24px;align-items:center;padding:30px 4px;border-bottom:1px solid var(--t-line)}
.vC .rw h3{font-size:clamp(28px,3.8vw,54px);color:var(--t-ink);transition:transform .5s var(--ease)}
.vC .rw p{color:var(--t-muted);max-width:46ch;font-size:16px}
.vC .rw .ar{width:22px;height:22px;color:var(--t-muted);transition:transform .45s var(--ease),color .3s}
.vC .rw.hot h3{transform:translateX(10px)}
.vC .rw.hot .ar{transform:translate(4px,-4px);color:var(--t-acc)}
.vC .rw .ico{display:none}
/* D: карточки в ряд, активный шаг переключается сам */
.vD .row4{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.vD .line{position:absolute;left:8%;right:8%;top:46px;height:2px;background:var(--t-line);z-index:0}
.vD .line i{position:absolute;inset:0;background:var(--t-acc);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .8s var(--ease)}
.vD .cd{position:relative;z-index:1;display:flex;flex-direction:column;gap:18px;padding:26px 24px;border-radius:24px;background:var(--t-card);border:1px solid var(--t-line);text-align:left;transition:transform .5s var(--ease),border-color .3s}
.vD .cd>*{transition:opacity .4s;opacity:.5}.vD .cd.on>*{opacity:1}
.vD .cd.on{transform:translateY(-6px);border-color:var(--t-acc)}
.vD .cd.on .ico{background:var(--t-acc);border-color:var(--t-acc);color:#fff;animation:pls 1.8s ease-out infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(163,32,47,.45)}100%{box-shadow:0 0 0 16px rgba(163,32,47,0)}}
.vD .cd h3{font-size:clamp(22px,2.2vw,30px);color:var(--t-ink)}
.vD .cd p{color:var(--t-muted);font-size:15px;line-height:1.5}
@media (max-width:900px){
 .vA .path{padding-left:68px}.vA .st .ico{left:-68px;width:44px;height:44px}.vA .rail{left:21px}
 .vB .tabs{grid-template-columns:1fr}.vB .panel{min-height:300px}
 .vC .rw{grid-template-columns:1fr 24px;gap:8px 12px}.vC .rw p{grid-column:1;grid-row:2}.vC .rw .ar{grid-column:2;grid-row:1}
 .vD .row4{grid-template-columns:1fr 1fr}.vD .line{display:none}
}
@media (max-width:560px){.vD .row4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div class="bar"><div class="wrap">
 <div class="grp" id="gV"><span>Упаковка</span><button data-v="A" class="on">A · Путь с линией</button><button data-v="B">B · Вкладки</button><button data-v="C">C · Список с подсветкой</button><button data-v="D">D · Карточки</button></div>
 <div class="grp" id="gT"><span>Фон</span><button data-v="light" class="on">Светлый (как сейчас)</button><button data-v="dark">Тёмный</button></div>
</div></div>
<section class="stage light" id="stage"><div class="wrap" id="out"></div></section>
<script>
const IC={"file-check": "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"/><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"/><path d=\"m9 15 2 2 4-4\"/>", "layout-template": "<rect width=\"18\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"/><rect width=\"9\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"/><rect width=\"5\" height=\"7\" x=\"16\" y=\"14\" rx=\"1\"/>", "code-xml": "<path d=\"m18 16 4-4-4-4\"/><path d=\"m6 8-4 4 4 4\"/><path d=\"m14.5 4-5 16\"/>", "rocket": "<path d=\"M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5\"/><path d=\"M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09\"/><path d=\"M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z\"/><path d=\"M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05\"/>"};
const svg=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(IC[n]||'')+'</svg>';
const STEPS=[
 {i:'file-check',t:'Задача',p:'Разбираемся, для кого проект и что он должен делать. Фиксируем объём, сроки и стоимость.'},
 {i:'layout-template',t:'Дизайн',p:'Готовлю структуру и макет. Обсуждаем до начала разработки.'},
 {i:'code-xml',t:'Разработка',p:'Собираю сайт. Даю ссылку, чтобы вы могли всё проверить.'},
 {i:'rocket',t:'Запуск',p:'Проверяю на телефоне и компьютере, подключаю домен, передаю доступы.'}
];
const AR='<svg class="ar" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 17 17 5M8 5h9v9"/></svg>';
const st={v:'A',t:'light'};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let timer=0,scrollFn=null;
function head(){return '<div class="head"><h2>Четыре шага до запуска</h2><p>Вы видите результат на каждом этапе, а не только в конце.</p></div>'}
function render(){
 clearInterval(timer); if(scrollFn){removeEventListener('scroll',scrollFn);scrollFn=null}
 const o=$('#out'); let h=head();
 if(st.v==='A') h+='<div class="path"><div class="rail"><i></i></div>'+STEPS.map(s=>'<div class="st"><span class="ico">'+svg(s.i)+'</span><h3>'+s.t+'</h3><p>'+s.p+'</p></div>').join('')+'</div>';
 if(st.v==='B') h+='<div class="tabs"><div class="list" role="tablist"><span class="pill"></span>'+STEPS.map((s,k)=>'<button type="button" role="tab" class="tb'+(k?'':' on')+'" data-k="'+k+'"><span class="ico">'+svg(s.i)+'</span>'+s.t+'</button>').join('')+'</div><div class="panel">'+STEPS.map((s,k)=>'<div class="pn'+(k?'':' on')+'"><span class="ico big on-ico">'+svg(s.i)+'</span><h3>'+s.t+'</h3><p>'+s.p+'</p></div>').join('')+'</div></div>';
 if(st.v==='C') h+='<div class="rows"><span class="hl"></span>'+STEPS.map(s=>'<div class="rw"><h3>'+s.t+'</h3><p>'+s.p+'</p>'+AR+'</div>').join('')+'</div>';
 if(st.v==='D') h+='<div class="row4"><div class="line"><i></i></div>'+STEPS.map((s,k)=>'<button type="button" class="cd'+(k?'':' on')+'" data-k="'+k+'"><span class="ico">'+svg(s.i)+'</span><h3>'+s.t+'</h3><p>'+s.p+'</p></button>').join('')+'</div>';
 o.className='wrap v'+st.v; o.innerHTML=h; init();
}
function init(){
 if(st.v==='A'){
  const path=$('.path'),items=$$('.st'),rail=path;
  scrollFn=()=>{const r=path.getBoundingClientRect(),vh=innerHeight;const p=Math.max(0,Math.min(1,(vh*.62-r.top)/(r.height)));path.style.setProperty('--p',p.toFixed(3));items.forEach(s=>{const sr=s.getBoundingClientRect();s.classList.toggle('on',sr.top<vh*.66)})};
  addEventListener('scroll',scrollFn,{passive:true});scrollFn();
 }
 if(st.v==='B'){
  const tbs=$$('.tb'),pns=$$('.pn'),pill=$('.pill');
  const move=k=>{const b=tbs[k];pill.style.top=b.offsetTop+'px';pill.style.height=b.offsetHeight+'px';tbs.forEach((x,i)=>{x.classList.toggle('on',i===k);x.setAttribute('aria-selected',i===k)});pns.forEach((x,i)=>x.classList.toggle('on',i===k))};
  tbs.forEach((b,k)=>{b.addEventListener('click',()=>move(k));b.addEventListener('mouseenter',()=>move(k))});
  requestAnimationFrame(()=>{pill.style.transition='none';move(0);void pill.offsetWidth;pill.style.transition=''});
 }
 if(st.v==='C'){
  const rows=$('.rows'),hl=$('.hl');
  $$('.rw').forEach(r=>{r.addEventListener('mouseenter',()=>{hl.style.top=r.offsetTop+'px';hl.style.height=r.offsetHeight+'px';hl.style.opacity=1;$$('.rw').forEach(x=>x.classList.toggle('hot',x===r))});});
  rows.addEventListener('mouseleave',()=>{hl.style.opacity=0;$$('.rw').forEach(x=>x.classList.remove('hot'))});
 }
 if(st.v==='D'){
  const cds=$$('.cd'),line=$('.line');let cur=0;
  const go=k=>{cur=k;cds.forEach((c,i)=>c.classList.toggle('on',i===k));line.style.setProperty('--p',(k/(cds.length-1)).toFixed(3))};
  cds.forEach((c,k)=>c.addEventListener('click',()=>{go(k);clearInterval(timer)}));
  go(0); if(!reduce) timer=setInterval(()=>go((cur+1)%cds.length),2600);
 }
}
function bind(id,key,after){$('#'+id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st[key]=b.dataset.v;$$('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));after&&after();render()})}
bind('gV','v');bind('gT','t',()=>{$('#stage').className='stage '+st.t});
render();
</script></body></html>
